<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>brpack demo</title>
  <style>
    textarea {
      width: 100%;
      height: 20em;
    }
  </style>
</head>
<body>
  <h2>brpack demo</h2>
  <p>Decode Brotli data natively when available, or via a WOFF2 color-font workaround in Chrome.</p>
  <p>
    Status: <span id="txtStatus"></span>
  </p>
  <div>Plaintext:</div>
  <textarea id="txtResult"></textarea>
  <p>
    Correct: <span id="txtVerify"></span>
  </p>
  <script>
    // Decode priority:
    // 1. Native Brotli via DecompressionStream.
    // 2. WOFF2 workaround in Chrome.
    // 3. Plain-text fallback.
    function loadFile(url, chars, callback) {
      try {
        var ds = new DecompressionStream('brotli');
        setDebug('Native Brotli loading...');

        fetch(url + '.brotli').then(function(res) {
          var s = res.body.pipeThrough(ds);
          new Response(s).text().then(callback);

          setDebug('Native Brotli done.');
        });
      } catch (err) {
        // In Chrome, OffscreenCanvas (69+) implies CBDT color-font support (66+).
        if (window.chrome && window.OffscreenCanvas) {
          loadFileFromFont(url, chars, callback);
        } else {
          loadFileFromPlain(url, callback);
        }
      }
    }
    var woffId = 0;

    function loadFileFromFont(url, chars, callback) {
      setDebug('WOFF2 loading...');

      var name = 'br' + woffId++;
      var font = new FontFace(name, 'url(' + url + '.woff2)');

      font.load().then(function() {
        document.fonts.add(font);

        var imgNum = chars.length;
        var canvas = new OffscreenCanvas(255, 255 * imgNum);
        var ctx = canvas.getContext('2d');
        ctx.font = '9px ' + name;

        for (var i = 0; i < imgNum; i++) {
          ctx.fillText(chars[i], 0, 1 + 255 * i);
        }
        var bin = ctx.getImageData(0, 0, 255, 255 * imgNum).data;
        var end = bin.lastIndexOf(99 /*END_MARK*/);
        if (end < 0) {
          // fallback
          setDebug('WOFF2 corrupted, falling back to plain text.');
          loadFileFromPlain(url, callback);
          return;
        }
        var p = 0;
        for (var i = 0; i < end; i++) {
          bin[p++] = bin[i++];
          bin[p++] = bin[i++];
          bin[p++] = bin[i++];
        }
        var str = new TextDecoder().decode(bin.subarray(0, p - 1));
        callback(str);
        setDebug('WOFF2 done.');
      }).catch(function() {
        setDebug('WOFF2 load failed, falling back to plain text.');
        loadFileFromPlain(url, callback);
      });
    }

    function loadFileFromPlain(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onload = function() {
        callback(xhr.responseText);
      };
      xhr.send();
    }


    function main() {
      // '123' maps to the glyphs in the font file
      loadFile('test.txt', '123', function(data) {
        txtResult.value = data;

        // Verify decoded output against the plain-text source.
        loadFileFromPlain('test.txt?verify', function(exp) {
          txtVerify.textContent = exp === data;
        });
      });
    }
    function setDebug(s) {
      txtStatus.textContent = s;
    }
    main();
  </script>
